[pytest]
testpaths = tests
python_files = test_*.py
addopts = -ra -q --ignore=tests/integration --ignore=tests/test_real_agent_run.py --ignore=tests/test_smoke_test.py --ignore=tests/test_swebench.py --ignore=tests/test_free_model.py --ignore=tests/test_patch_pipeline.py --ignore=tests/test_execution.py --ignore=tests/test_environment.py
filterwarnings =
    ignore::pytest.PytestCollectionWarning
    ignore::DeprecationWarning
