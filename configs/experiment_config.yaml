experiment_name: "test_experiment"
configuration: "SINGLE_AGENT_BASELINE"
models:
  groq_model:
    provider: "groq"
    model: "qwen/qwen3.8-27b"
    temperature: 0.2
    max_tokens: 2000
  openrouter_model_1:
    provider: "openrouter"
    model: "openrouter/free"
    temperature: 0.2
    max_tokens: 2000
  openrouter_model_2:
    provider: "openrouter"
    model: "google/gemma-4-26b-a4b-it:free"
    temperature: 0.2
    max_tokens: 2000
max_debug_iterations: 3
enable_rag: false
enable_ml: false
enable_verification: false
dataset_name: "dummy_dataset"
random_seed: 42
logging_level: "INFO"
execution:
  runtime: docker
  image: python:3.11-slim
  timeout_seconds: 30
  memory_limit_mb: 512
  cpu_limit: 1.0
  network_enabled: false
  cleanup: true
